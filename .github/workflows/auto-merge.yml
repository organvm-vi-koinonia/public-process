name: Review Automatic Merge Readiness
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - name: Report deferred automatic merge authority
        run: |
          echo "Automatic merging is parked under issue 55."
          echo "The former age/label/possibly-empty-check rule did not establish exact-head review or publication authority."
          echo "Use reviewed PR merges; restore autonomous merging only with trusted check identity, current-head approval and adversarial tests."
          echo "No branch or issue is deleted by this workflow."
