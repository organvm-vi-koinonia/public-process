name: Publication Distribution Approval Status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approval-status:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve separate distribution authority
        run: |
          echo "A source push or preservation approval is not a channel-distribution receipt."
          echo "Distribution is parked under issues 60 and 65 until an exact edition, author approval, channel and deduplication receipt are verified."
          echo "No notification or external dispatch was sent."
